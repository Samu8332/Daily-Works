```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="samo.css">
</head>
<body>

    <div class="container">

        <div class="form-header">
            <h1>Student Registration</h1>
            <p>Fill in the details below to register as a student</p>
        </div>

        <form>

            <!-- Personal Information -->
            <h2>Personal Information</h2>

            <div class="form-row">
                <div class="form-group">
                    <label for="fname">First Name</label>
                    <input type="text" id="fname" name="fname"
                           placeholder="Enter first name" required>
                </div>

                <div class="form-group">
                    <label for="lname">Last Name</label>
                    <input type="text" id="lname" name="lname"
                           placeholder="Enter last name" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required>
                </div>

                <div class="form-group">
                    <label>Gender</label>

                    <div class="radio-group">
                        <label>
                            <input type="radio" name="gender" value="male">
                            Male
                        </label>

                        <label>
                            <input type="radio" name="gender" value="female">
                            Female
                        </label>

                        <label>
                            <input type="radio" name="gender" value="other">
                            Other
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="parent">Parent / Guardian Name</label>
                <input type="text" id="parent" name="parent"
                       placeholder="Enter parent or guardian name" required>
            </div>

            <!-- Contact Information -->
            <h2>Contact Information</h2>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                           placeholder="example@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone"
                           placeholder="Enter phone number" required>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address"
                          placeholder="Enter your complete address"
                          rows="4" required></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city"
                           placeholder="Enter city" required>
                </div>

                <div class="form-group">
                    <label for="state">State</label>
                    <select id="state" name="state" required>
                        <option value="">Select State</option>
                        <option>Andhra Pradesh</option>
                        <option>Telangana</option>
                        <option>Karnataka</option>
                        <option>Tamil Nadu</option>
                        <option>Kerala</option>
                        <option>Maharashtra</option>
                        <option>Delhi</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="pincode">Pincode</label>
                    <input type="text" id="pincode" name="pincode"
                           placeholder="Enter pincode" required>
                </div>
            </div>

            <!-- Academic Information -->
            <h2>Academic Information</h2>

            <div class="form-group">
                <label for="course">Course / Program</label>
                <select id="course" name="course" required>
                    <option value="">Select Course</option>
                    <option>B.Tech</option>
                    <option>B.Sc</option>
                    <option>B.Com</option>
                    <option>B.A</option>
                    <option>M.Tech</option>
                    <option>M.Sc</option>
                    <option>M.Com</option>
                    <option>MBA</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="qualification">Previous Qualification</label>
                    <select id="qualification" name="qualification" required>
                        <option value="">Select Qualification</option>
                        <option>10th</option>
                        <option>12th</option>
                        <option>Diploma</option>
                        <option>Graduation</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="percentage">Percentage / CGPA</label>
                    <input type="text" id="percentage" name="percentage"
                           placeholder="Enter percentage or CGPA" required>
                </div>

                <div class="form-group">
                    <label for="year">Passing Year</label>
                    <select id="year" name="year" required>
                        <option value="">Select Year</option>
                        <option>2026</option>
                        <option>2025</option>
                        <option>2024</option>
                        <option>2023</option>
                        <option>2022</option>
                        <option>2021</option>
                    </select>
                </div>
            </div>

            <!-- Additional Information -->
            <h2>Additional Information</h2>

            <div class="form-group">
                <label for="hobbies">Hobbies</label>
                <textarea id="hobbies" name="hobbies"
                          placeholder="Enter your hobbies"></textarea>
            </div>

            <div class="form-group">
                <label for="photo">Upload Photograph</label>
                <input type="file" id="photo" name="photo"
                       accept="image/*">
            </div>

            <!-- Login Information -->
            <h2>Account Information</h2>

            <div class="form-row">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username"
                           placeholder="Create username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="Create password" required>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password"
                       name="confirm-password"
                       placeholder="Confirm your password" required>
            </div>

            <!-- Terms -->
            <div class="terms">
                <label>
                    <input type="checkbox" required>
                    I agree to the terms and conditions.
                </label>
            </div>

            <!-- Buttons -->
            <div class="button-group">
                <button type="submit" class="register-btn">
                    Register
                </button>

                <button type="reset" class="reset-btn">
                    Reset
                </button>
            </div>

        </form>

    </div>

</body>
</html>
```
