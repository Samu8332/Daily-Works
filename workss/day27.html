<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>FORM APPLICATION</title>
</head>
<body>
    <form>
<label>NAME</label>
<input type="text" placeholder="ENTER YOUR NAME">
<br><br>
<label>AGE</label>
<input type="number" placeholder="ENTER YOUR NAME">
<br><br>
<label>VILLAGE</label>
<input type="text" placeholder="ENTER YOUR VILLAGE">
<br><br>
<label for="MALE">MALE</label>
<input type="radio" id="MALE" name="GENDER" value="MALE">
<label for="FEMALE">FEMALE</label>
<input type="radio" id="FEMALE" name="GENDER" value="MALE">
<br><br>
<label for="dob">DATE OF BIRTH</label> 
<input type="date" id="dob">
<br><br>
<label for="Email">EMAIL</label>
<input type="email" id="email" placeholder="ENTER YOUR EMAIL">
<br><br>
<label for="RELIGION">RELIGION:</label>
<select id="RELIGION">
<option value="HINDU">HINDU</option>
<option value="CHRISTIAN">CHRISTIAN</option>
<option value="MUSLIM">MUSLIM</option>
<option value="SIKK">SIKK</option>
<option value="OTHERS">OTHERS</option>
</select> 
<br><br>
<label for="EDUCATIONAL QUALIFICATION">EDUCATIONAL QUALIFICATION</label>
<select id="EDUCATIONAL QUALIFICATION">
<option value="SSC">SSC</option>
<option value="INTER">INTER</option>
<option value="GRADUATION">GRADUATION</option>
<option value="POST GRADUATION">POST GRADUATION</option>
<option value="OTHERS">OTHERS</option>
</select>
<br><br>
<label for="MOBILE">MOBILE NUMBER</label>
<input type="tel" id="MOBILE" maxlength="10" required="">
<br><br>
<label for="password">PASSWORD:</label>
<input type="password" id="password" maxlength="8" required="">
<br><br>
<label for="message">MESSAGE:</label>
<textarea id="message" rows="3" cols="40"></textarea>
<br><br>
<button type="submit">SUBMIT</button>
<button type="reset">RESET</button>
</form>
